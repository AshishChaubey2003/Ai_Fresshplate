<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — FreshPlate</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .menu-page {
      --c-primary: var(--primary, #ff6b35);
      --c-bg: var(--bg, #f8f9fb);
      --c-border: var(--border, #e6e8ec);
      --c-muted: var(--text-muted, #8a8f98);
      --c-text2: var(--text-secondary, #5b6068);
      --c-success: var(--success, #06d6a0);
    }

    .menu-hero {
      background: linear-gradient(135deg, #fff5f0, #f0f7f4);
      padding: clamp(1.75rem, 4vw, 3rem) 0 2rem;
      margin-top: 70px;
    }

    .menu-hero-title {
      font-size: clamp(1.6rem, 1.2rem + 1.8vw, 2.3rem);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      border: 1px solid var(--c-border);
      max-width: 580px;
      margin-top: 1.25rem;
    }

    .search-bar:focus-within { border-color: var(--c-primary); }

    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.97rem;
      min-width: 0;
      background: transparent;
    }

    .search-clear {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--c-muted);
      font-size: 1.1rem;
      padding: 0 0.25rem;
      display: none;
    }

    .menu-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 1.75rem;
      margin-top: 1.75rem;
    }

    .filters-sidebar { position: sticky; top: 90px; height: fit-content; }

    .filter-card {
      background: #fff;
      border-radius: 14px;
      padding: 1.15rem;
      border: 1px solid var(--c-border);
      margin-bottom: 0.9rem;
    }

    .filter-title { font-weight: 700; margin-bottom: 0.85rem; font-size: 0.92rem; }

    .filter-options { display: flex; flex-direction: column; gap: 0.35rem; }

    .filter-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      cursor: pointer;
      padding: 0.5rem 0.7rem;
      border-radius: 9px;
      font-size: 0.88rem;
      color: var(--c-text2);
      border: 1.5px solid transparent;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .filter-option:hover { background: var(--c-bg); }

    .filter-option.active {
      background: rgba(255,107,53,0.08);
      color: var(--c-primary);
      border-color: rgba(255,107,53,0.2);
      font-weight: 600;
    }

    .category-count {
      background: var(--c-bg);
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 0.74rem;
      color: var(--c-muted);
      flex-shrink: 0;
    }

    .filter-option.active .category-count {
      background: rgba(255,107,53,0.15);
      color: var(--c-primary);
    }

    .veg-toggle {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--c-text2);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    .toggle-switch {
      width: 42px;
      height: 23px;
      background: var(--c-border);
      border-radius: 12px;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle-switch.on { background: var(--c-success); }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 17px;
      height: 17px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .toggle-switch.on::after { left: 22px; }

    .menu-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .results-count { font-size: 0.89rem; color: var(--c-text2); }

    .sort-select {
      padding: 0.45rem 0.85rem;
      border: 1.5px solid var(--c-border);
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.88rem;
      background: #fff;
      cursor: pointer;
    }

    .sort-select:focus { outline: none; border-color: var(--c-primary); }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.25rem;
    }

    .card-skeleton {
      height: 300px;
      border-radius: 14px;
      background: linear-gradient(90deg, #eef0f4 25%, #f6f7f9 50%, #eef0f4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .filters-toggle { display: none; }

    @media (max-width: 860px) {
      .menu-layout { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
      .filters-sidebar { position: static; }

      .filters-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0.7rem 1rem;
        border: 1px solid var(--c-border);
        border-radius: 12px;
        background: #fff;
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
      }

      .filters-body { display: none; margin-top: 0.75rem; }
      .filters-body.open { display: block; }
      .filter-options { flex-direction: row; flex-wrap: wrap; }
      .filter-option { width: auto; }
    }

    @media (max-width: 480px) {
      .menu-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.85rem; }
    }

    .menu-page :focus-visible {
      outline: 2px solid var(--c-primary);
      outline-offset: 2px;
      border-radius: 8px;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-skeleton { animation: none; }
      .toggle-switch, .toggle-switch::after { transition: none; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">Fresh<span>Plate</span></a>
    <ul class="navbar-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html" class="active">Menu</a></li>
      <li><a href="donation.html">Donate Food</a></li>
      <li><a href="chatbot.html">AI Assistant</a></li>
      <li><a href="orders.html">My Orders</a></li>
    </ul>
    <div class="navbar-actions"></div>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div class="menu-page">
    <header class="menu-hero">
      <div class="container">
        <h1 class="menu-hero-title">Today's menu</h1>
        <p style="color:var(--c-text2);">Everything below is cooked after you order it.</p>
        <div class="search-bar">
          <span aria-hidden="true">🔍</span>
          <label for="searchInput" style="position:absolute;left:-9999px;">Search dishes</label>
          <input type="search" id="searchInput" placeholder="Search dishes, ingredients…" autocomplete="off">
          <button class="search-clear" id="searchClear" aria-label="Clear search">×</button>
        </div>
      </div>
    </header>

    <div class="container" style="padding-bottom:3rem;">
      <div class="menu-layout">

        <!-- FILTERS -->
        <div class="filters-sidebar">
          <button class="filters-toggle" id="filtersToggle" aria-expanded="false">
            <span>Filters</span>
            <span id="filtersToggleIcon">▾</span>
          </button>

          <div class="filters-body" id="filtersBody">
            <div class="filter-card">
              <div class="filter-title">Preference</div>
              <button class="veg-toggle" id="vegToggleBtn" aria-pressed="false">
                <span class="toggle-switch" id="vegToggle"></span>
                Vegetarian only
              </button>
            </div>

            <div class="filter-card">
              <div class="filter-title">Categories</div>
              <div class="filter-options" id="categoryFilters">
                <button class="filter-option active" data-category="all">
                  <span>All dishes</span>
                  <span class="category-count" id="allCount">–</span>
                </button>
              </div>
            </div>

            <div class="filter-card">
              <div class="filter-title">Kind</div>
              <div class="filter-options" id="statusFilters">
                <button class="filter-option active" data-status="all">Everything</button>
                <button class="filter-option" data-status="available">Regular menu</button>
                <button class="filter-option" data-status="rescue">🤝 Rescue deals</button>
              </div>
            </div>

            <button class="btn btn-ghost btn-sm btn-block" id="clearFiltersBtn" style="display:none;">
              Clear all filters
            </button>
          </div>
        </div>

        <!-- GRID -->
        <div>
          <div class="menu-toolbar">
            <div class="results-count" id="resultsCount">Loading the menu…</div>
            <select class="sort-select" id="sortSelect" aria-label="Sort dishes">
              <option value="default">Most ordered</option>
              <option value="price_low">Price: low to high</option>
              <option value="price_high">Price: high to low</option>
              <option value="rating">Top rated</option>
              <option value="prep">Fastest to make</option>
            </select>
          </div>

          <div class="menu-grid" id="menuGrid">
            <div class="card-skeleton"></div>
            <div class="card-skeleton"></div>
            <div class="card-skeleton"></div>
            <div class="card-skeleton"></div>
            <div class="card-skeleton"></div>
            <div class="card-skeleton"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© <span id="year"></span> FreshPlate. Built by Ashish Kumar Chaubey</p>
      </div>
    </div>
  </footer>

  <script src="javascript/main.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let allFoods = [];
    let categories = [];
    let filteredFoods = [];

    const state = {
      category: 'all',
      status: 'all',
      vegOnly: false,
      search: '',
      sort: 'default',
    };

    /* ---------- read filters from the URL so links and refresh keep working ---------- */
    function readUrlFilters() {
      const params = new URLSearchParams(window.location.search);
      // index.html links use ?status=rescue; older links used ?type=rescue
      const status = params.get('status') || params.get('type');
      if (['available', 'rescue'].includes(status)) state.status = status;

      const category = params.get('category');
      if (category && /^\d+$/.test(category)) state.category = Number(category);

      if (params.get('veg') === 'true') state.vegOnly = true;

      const search = params.get('q');
      if (search) {
        state.search = search;
        document.getElementById('searchInput').value = search;
      }
    }

    function writeUrlFilters() {
      const params = new URLSearchParams();
      if (state.status !== 'all') params.set('status', state.status);
      if (state.category !== 'all') params.set('category', state.category);
      if (state.vegOnly) params.set('veg', 'true');
      if (state.search) params.set('q', state.search);

      const query = params.toString();
      history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
    }

    /* ---------- load ---------- */
    async function loadMenu() {
      try {
        const [foods, cats] = await Promise.all([
          Api.get('/food/items/', false),
          Api.get('/food/categories/', false),
        ]);
        allFoods = foods;
        categories = cats;
        renderCategories();
        syncFilterUI();
        applyFilters();
      } catch (e) {
        document.getElementById('resultsCount').textContent = '';
        document.getElementById('menuGrid').innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-state-icon">📡</div>
            <div class="empty-state-title">Menu didn't load</div>
            <p style="margin-bottom:1rem;">${esc(apiErrorMessage(e, 'The kitchen server is not responding.'))}</p>
            <button class="btn btn-primary" onclick="loadMenu()">Try again</button>
          </div>`;
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoryFilters');
      document.getElementById('allCount').textContent = allFoods.length;

      // food_count comes from the API and counts only available items
      categories.forEach(cat => {
        const count = cat.food_count ?? allFoods.filter(f => f.category === cat.id).length;
        if (count === 0) return; // hide empty categories

        const btn = document.createElement('button');
        btn.className = 'filter-option';
        btn.dataset.category = cat.id;
        btn.innerHTML = `<span>${esc(cat.name)}</span><span class="category-count">${count}</span>`;
        container.appendChild(btn);
      });
    }

    /* ---------- filters ---------- */
    function syncFilterUI() {
      document.querySelectorAll('#categoryFilters .filter-option').forEach(el => {
        el.classList.toggle('active', String(el.dataset.category) === String(state.category));
      });
      document.querySelectorAll('#statusFilters .filter-option').forEach(el => {
        el.classList.toggle('active', el.dataset.status === state.status);
      });

      document.getElementById('vegToggle').classList.toggle('on', state.vegOnly);
      document.getElementById('vegToggleBtn').setAttribute('aria-pressed', String(state.vegOnly));
      document.getElementById('searchClear').style.display = state.search ? 'block' : 'none';

      const hasFilters = state.category !== 'all' || state.status !== 'all' || state.vegOnly || state.search;
      document.getElementById('clearFiltersBtn').style.display = hasFilters ? 'block' : 'none';
    }

    function applyFilters() {
      filteredFoods = allFoods.filter(f => {
        if (state.category !== 'all' && f.category !== state.category) return false;
        if (state.status !== 'all' && f.status !== state.status) return false;
        if (state.vegOnly && !f.is_veg) return false;
        if (state.search) {
          const query = state.search.toLowerCase();
          const inName = (f.name || '').toLowerCase().includes(query);
          const inDesc = (f.description || '').toLowerCase().includes(query);
          const inCategory = (f.category_name || '').toLowerCase().includes(query);
          if (!inName && !inDesc && !inCategory) return false;
        }
        return true;
      });

      // Prices arrive as strings ("1000"), so compare numbers - not text
      const num = (v) => parseFloat(v) || 0;
      const sorters = {
        price_low: (a, b) => num(a.final_price) - num(b.final_price),
        price_high: (a, b) => num(b.final_price) - num(a.final_price),
        rating: (a, b) => num(b.rating) - num(a.rating),
        prep: (a, b) => num(a.preparation_time) - num(b.preparation_time),
      };
      if (sorters[state.sort]) filteredFoods.sort(sorters[state.sort]);

      syncFilterUI();
      writeUrlFilters();
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      const count = filteredFoods.length;
      document.getElementById('resultsCount').textContent =
        count === 0 ? 'Nothing matches' : `${count} ${count === 1 ? 'dish' : 'dishes'}`;

      if (count === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-title">Nothing matches these filters</div>
            <p style="margin-bottom:1rem;">Try a different search or clear the filters.</p>
            <button class="btn btn-primary" onclick="clearFilters()">Clear filters</button>
          </div>`;
        return;
      }
      grid.innerHTML = filteredFoods.map(createFoodCard).join('');
    }

    function clearFilters() {
      state.category = 'all';
      state.status = 'all';
      state.vegOnly = false;
      state.search = '';
      document.getElementById('searchInput').value = '';
      applyFilters();
    }

    /* ---------- events ---------- */
    document.getElementById('categoryFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-option');
      if (!btn) return;
      state.category = btn.dataset.category === 'all' ? 'all' : Number(btn.dataset.category);
      applyFilters();
    });

    document.getElementById('statusFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-option');
      if (!btn) return;
      state.status = btn.dataset.status;
      applyFilters();
    });

    document.getElementById('vegToggleBtn').addEventListener('click', () => {
      state.vegOnly = !state.vegOnly;
      applyFilters();
    });

    // Debounce: filtering on every keystroke is wasteful on a long menu
    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const value = e.target.value.trim();
      searchTimer = setTimeout(() => {
        state.search = value;
        applyFilters();
      }, 250);
    });

    document.getElementById('searchClear').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      state.search = '';
      applyFilters();
      document.getElementById('searchInput').focus();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      state.sort = e.target.value;
      applyFilters();
    });

    document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);

    document.getElementById('filtersToggle').addEventListener('click', (e) => {
      const body = document.getElementById('filtersBody');
      const open = body.classList.toggle('open');
      e.currentTarget.setAttribute('aria-expanded', String(open));
      document.getElementById('filtersToggleIcon').textContent = open ? '▴' : '▾';
    });

    readUrlFilters();
    loadMenu();
  </script>
</body>
</html>
